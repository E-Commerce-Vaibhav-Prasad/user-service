spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs       # Endpoint for raw OpenAPI JSON JSON
  swagger-ui:
    path: /swagger-ui.html   # Custom URL to view the UI portal
    enabled: true

eureka:
  client:
    register-with-eureka: true # Tells the app to register with the server
    fetch-registry: true       # Allows this service to cache and discover other services
    service-url:
      defaultZone: http://localhost:8761/eureka/ # The URL of your Eureka Server
